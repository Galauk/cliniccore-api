services:
  postgres:
    image: postgres:16
    container_name: cliniccore-postgres
    environment:
      POSTGRES_DB: cliniccore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - cliniccore_data:/var/lib/postgresql/data

volumes:
  cliniccore_data:
